[build-system]
requires = ["maturin==1.10.2"]
build-backend = "maturin"

[project]
name = "r-ext-hermes"
version = "0.1.0"
description = "Optional Hermes communication policies"
requires-python = ">=3.10"

[project.entry-points."hermes_agent.plugins"]
r-ext-hermes = "r_ext_hermes:register"

[tool.maturin]
features = ["python"]
