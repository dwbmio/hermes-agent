[package]
name = "r-ext-hermes"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "r_ext_hermes"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "=0.27.2", optional = true, features = ["extension-module", "abi3-py310"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
